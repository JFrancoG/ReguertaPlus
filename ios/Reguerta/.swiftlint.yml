included:
  - Reguerta
  - ReguertaTests
  - ReguertaUITests

excluded:
  - Reguerta.xcodeproj
  - Reguerta.xcworkspace
  - .build
  - DerivedData
  - Pods

line_length:
  warning: 120
  error: 140
  ignores_urls: true
  ignores_comments: true
  ignores_multiline_strings: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 400

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 48
    error: 80

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 56
    error: 64

reporter: "xcode"
